<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LifeMap</title>
<style>
body {
font-family: Arial, sans-serif;
max-width: 700px;
margin: 40px auto;
padding: 20px;
background: #f5f5f5;
color: #333;
}
h1 {
color: #2c3e50;
}
h2 {
margin-top: 40px;
color: #444;
}
label {
display: block;
margin-top: 15px;
}
input, textarea {
width: 100%;
padding: 10px;
margin-top: 5px;
border: 1px solid #ccc;
border-radius: 4px;
}
button {
margin-top: 15px;
background-color: #4CAF50;
color: white;
border: none;
padding: 10px 20px;
border-radius: 4px;
cursor: pointer;
}
button:hover {
background-color: #45a049;
}
a.button-link {
display: inline-block;
margin-top: 10px;
padding: 10px 15px;
background: #007bff;
color: white;
text-decoration: none;
border-radius: 4px;
}
img {
margin-top: 20px;
max-width: 100%;
}
</style>
</head>
<body>

<h1>Welcome to LifeMap</h1>
<p>This is the beginning of something amazing.</p>

<h2>Contact Us</h2>
<form action="mailto:your-email@example.com" method="post" enctype="text/plain">
<label>Name:<input type="text" name="name" required></label>
<label>Email:<input type="email" name="email" required></label>
<label>Message:<textarea name="message" rows="4" required></textarea></label>
<button type="submit">Send</button>
</form>

<h2>Explore More</h2>
<a href="https://your-app-link.com" class="button-link">Visit Our App</a>

<h2>Our Vision</h2>
<img src="https://via.placeholder.com/600x300?text=LifeMap+Vision" alt="LifeMap Vision">

</body>
</html>
