<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LifeMap</title>
<style>
body {
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(to right, #c9d6ff, #e2e2e2);
margin: 0;
padding: 40px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}

h1 {
color: #2c3e50;
margin-bottom: 5px;
}

p {
color: #555;
margin-bottom: 30px;
}

form {
background: white;
padding: 20px;
border-radius: 8px;
box-shadow: 0 0 10px rgba(0,0,0,0.1);
width: 100%;
max-width: 400px;
}

label {
display: block;
margin-top: 15px;
color: #333;
}

input, textarea {
width: 100%;
padding: 10px;
margin-top: 5px;
border: 1px solid #ccc;
border-radius: 4px;
}

button {
margin-top: 15px;
padding: 10px 15px;
background: #007bff;
color: white;
border: none;
border-radius: 4px;
cursor: pointer;
}

button:hover {
background: #0056b3;
}

.footer {
margin-top: 40px;
font-size: 0.9em;
color: #666;
}
</style>
</head>
<body>
<h1>Welcome to LifeMap</h1>
<p>This is the beginning of something amazing.</p>

<form action="mailto:your-email@example.com" method="post" enctype="text/plain">
<label>Name:</label>
<input type="text" name="name" required>

<label>Email:</label>
<input type="email" name="email" required>

<label>Message:</label>
<textarea name="message" rows="4" required></textarea>

<button type="submit">Send</button>
</form>

<div class="footer">Thank you for supporting our journey.</div>
</body>
</html>
