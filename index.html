<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LifeMap</title>
<style>
body {
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(to right, #c9d6ff, #e2e2e2);
margin: 0;
padding: 40px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}

h1 {
color: #2c3e50;
margin-bottom: 10px;
}

h2 {
margin-top: 30px;
color: #444;
}

form {
background: white;
padding: 25px;
border-radius: 10px;
box-shadow: 0 0 15px rgba(0,0,0,0.1);
width: 100%;
max-width: 350px;
}

label {
display: block;
margin-top: 15px;
font-size: 14px;
}

input, textarea {
width: 100%;
padding: 10px;
margin-top: 5px;
border: 1px solid #ccc;
border-radius: 5px;
}

button {
margin-top: 15px;
padding: 10px 20px;
background: #ff6b6b;
color: white;
border: none;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
}

button:hover {
background: #ff3b3b;
}

.footer {
margin-top: 30px;
font-size: 14px;
color: #777;
text-align: center;
}

.logo {
max-width: 120px;
margin-bottom: 20px;
}
</style>
</head>
<body>

<!-- Optional Logo -->
<!-- <img src="https://your-logo-url.com/logo.png" alt="LifeMap Logo" class="logo"> -->

<h1>Welcome to LifeMap</h1>
<p>This is the beginning of something amazing.</p>

<form action="mailto:your-email@example.com" method="post" enctype="text/plain">
<h2>Contact Us</h2>
<label>Name:</label>
<input type="text" name="name" required />

<label>Email:</label>
<input type="email" name="email" required />

<label>Message:</label>
<textarea name="message" rows="4" required></textarea>

<button type="submit">Send</button>
</form>

<div class="footer">
Thank you for supporting our journey.
<br />
<a href="https://lifemapjapan.github.io" style="color:#999;">lifemapjapan.github.io</a>
</div>

</body>
</html>
